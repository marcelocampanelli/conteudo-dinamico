<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conteúdo Dinâmico</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 font-sans text-slate-100 antialiased">
  <main class="flex min-h-screen items-center justify-center p-6">
    <div class="w-full max-w-md rounded-2xl border border-white/10 bg-white/5 p-8 shadow-2xl shadow-indigo-500/10 backdrop-blur-sm">
      <div class="mb-8 text-center">
        <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-xl bg-indigo-500/20 text-indigo-300">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
          </svg>
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-white">Link Dinâmico</h1>
        <p class="mt-2 text-sm text-slate-400">Defina uma URL e atualize o destino do link abaixo.</p>
      </div>

      <div class="space-y-4">
        <div>
          <label for="url-input" class="mb-1.5 block text-sm font-medium text-slate-300">Nova URL</label>
          <input
            type="url"
            id="url-input"
            placeholder="https://exemplo.com"
            class="w-full rounded-lg border border-white/10 bg-slate-900/60 px-4 py-2.5 text-sm text-white placeholder-slate-500 outline-none transition focus:border-indigo-400 focus:ring-2 focus:ring-indigo-400/30"
          >
        </div>

        <button
          type="button"
          id="update-link"
          class="w-full rounded-lg bg-indigo-500 px-4 py-2.5 text-sm font-semibold text-white shadow-lg shadow-indigo-500/25 transition hover:bg-indigo-400 active:scale-[0.98]"
        >
          Atualizar link
        </button>
      </div>

      <div class="mt-8 rounded-lg border border-white/5 bg-slate-900/40 p-4">
        <p class="mb-2 text-xs font-medium uppercase tracking-wider text-slate-500">Link atual</p>
        <a
          id="dynamic-link"
          href="https://www.google.com"
          target="_blank"
          rel="noopener noreferrer"
          class="inline-flex items-center gap-2 text-sm font-medium text-indigo-300 transition hover:text-indigo-200 hover:underline"
        >
          <span id="link-label">Google</span>
          <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
          </svg>
        </a>
        <p id="current-url" class="mt-2 truncate text-xs text-slate-500">https://www.google.com</p>
      </div>
    </div>
  </main>

  <script>
    const urlInput = document.getElementById('url-input');
    const updateButton = document.getElementById('update-link');
    const dynamicLink = document.getElementById('dynamic-link');
    const linkLabel = document.getElementById('link-label');
    const currentUrl = document.getElementById('current-url');

    updateButton.addEventListener('click', () => {
      const url = urlInput.value.trim();
      if (url) {
        dynamicLink.href = url;
        dynamicLink.target = '_blank';
        dynamicLink.rel = 'noopener noreferrer';
        currentUrl.textContent = url;

        try {
          const hostname = new URL(url).hostname.replace('www.', '');
          linkLabel.textContent = hostname;
        } catch {
          linkLabel.textContent = url;
        }
      }
    });
  </script>
</body>

</html>
